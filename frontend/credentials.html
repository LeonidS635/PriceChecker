<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Credentials — AviParts</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo logo-link">
                    <div class="logo-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                    </div>
                    <h1>AviParts</h1>
                </a>

                <h2 class="page-title">Portal Credentials</h2>

                <a href="index.html" class="btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to search
                </a>
            </div>
        </div>
    </header>

    <main class="credentials-page">
        <div class="container">
            <div class="credentials-intro card-panel">
                <p>Enter login and password for each supplier portal. Saved credentials are used when you sign in from
                    the main page.</p>
            </div>

            <div id="credentialsStatus" class="credentials-status" hidden></div>

            <div class="credentials-list card-panel" id="credentialsList">
                <p class="loading-text">Loading portals…</p>
            </div>

            <div class="credentials-actions">
                <button class="btn btn-primary" id="saveCredentialsBtn" disabled>Save credentials</button>
            </div>
        </div>
    </main>

    <script src="common.js"></script>
    <script src="credentials.js"></script>
</body>

</html>
