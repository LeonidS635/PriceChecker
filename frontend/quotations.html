<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotations — AviParts</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo logo-link">
                    <div class="logo-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                    </div>
                    <h1>AviParts</h1>
                </a>

                <h2 class="page-title">Quotations</h2>

                <a href="index.html" class="btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to search
                </a>
            </div>
        </div>
    </header>

    <main class="quotations-page">
        <div class="container">
            <div class="client-headers-row card-panel" id="clientHeadersRow">
                <button type="button" class="client-header-btn" data-client-id="1">Aeroflot</button>
                <button type="button" class="client-header-btn" data-client-id="2">Belavia</button>
                <button type="button" class="client-header-btn" data-client-id="3">UTair</button>
                <button type="button" class="client-header-btn" data-client-id="4">Pobeda</button>
            </div>

            <div id="lettersPanel" class="letters-panel card-panel" hidden>
                <div id="lettersStatus" class="letters-status" hidden></div>
                <div id="lettersList" class="letters-list"></div>
                <div class="pagination-controls">
                    <button type="button" class="btn" id="prevPageBtn" disabled>Previous</button>
                    <span id="pageIndicator" class="page-indicator">Page 1</span>
                    <button type="button" class="btn" id="nextPageBtn" disabled>Next</button>
                </div>
            </div>
        </div>
    </main>

    <script src="common.js"></script>
    <script src="quotations.js"></script>
</body>

</html>
