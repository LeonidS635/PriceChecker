services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: credentials_keeper
    ports:
      - "5432:5432"
    volumes:
      - credentials_keeper_pg:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credentials_keeper"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  credentials_keeper_pg:
