services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - rfq_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  rfq-listener:
    build:
      context: ./listener
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./listener/.env
    volumes:
      - rfq_listener_data:/data
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy

  rfq-extractor:
    build:
      context: ./extractor
      dockerfile: Dockerfile
      args:
        DEVICE: ${RFQ_GLINER_DEVICE:-cpu}
    restart: unless-stopped
    env_file:
      - ./extractor/.env
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy

  connect-mailbox:
    profiles: ["tools"]
    build:
      context: ./listener
      dockerfile: Dockerfile
    env_file:
      - ./listener/.env
    volumes:
      - rfq_listener_data:/data
    stdin_open: true
    tty: true
    entrypoint: ["python", "connect_mailbox.py"]

volumes:
  rfq_minio_data:
  rfq_listener_data:

networks:
  default:
    name: pricechecker
    external: true
